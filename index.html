<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Per te 💌</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family: Georgia, serif;
      background: #f8eee9;
      color: #4b3030;
    }

    .app {
      width: 100%;
      max-width: 420px;
      text-align: center;
      padding: 40px 24px;
      border-radius: 28px;
      background: #fffaf7;
      box-shadow: 0 10px 30px rgba(80, 40, 40, 0.12);
    }

    .heart {
      font-size: 58px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 38px;
      margin: 0 0 12px;
    }

    .subtitle {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .day {
      font-size: 15px;
      opacity: 0.7;
      margin-bottom: 24px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 16px 28px;
      font-size: 17px;
      font-family: inherit;
      cursor: pointer;
      background: #b86b72;
      color: white;
      box-shadow: 0 6px 15px rgba(120, 50, 60, 0.2);
    }

    button:active {
      transform: scale(0.96);
    }

    .message {
      display: none;
      margin-top: 30px;
      padding: 24px;
      border-radius: 20px;
      background: #f8eee9;
      font-size: 20px;
      line-height: 1.7;
      animation: appear 0.8s ease;
    }

    .message.show {
      display: block;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <main class="app">
    <div class="heart">💌</div>

    <h1>Per te</h1>

    <p class="subtitle">
      Ho preparato qualcosa per te.
    </p>

    <div class="day">
      Giorno 1 di 10
    </div>

    <button id="openButton">
      APRI IL MESSAGGIO 💌
    </button>

    <div class="message" id="message">
      Il tuo primo messaggio arriverà qui 💕
    </div>
  </main>

  <script>
    const button = document.getElementById("openButton");
    const message = document.getElementById("message");

    button.addEventListener("click", function() {
      message.classList.add("show");
      button.style.display = "none";

      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.frequency.value = 600;
      gainNode.gain.value = 0.08;

      oscillator.start();
      oscillator.stop(audioContext.currentTime + 0.15);
    });
  </script>

</body>
</html>
