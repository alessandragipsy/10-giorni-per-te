<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Per te 💌</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family: Georgia, serif;
      background: #f8eee9;
      color: #4b3030;
    }

    .app {
      width: 100%;
      max-width: 420px;
      text-align: center;
      padding: 40px 24px;
      border-radius: 28px;
      background: #fffaf7;
      box-shadow: 0 10px 30px rgba(80, 40, 40, 0.12);
    }

    .heart {
      font-size: 58px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 38px;
      margin: 0 0 12px;
    }

    .subtitle {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .day {
      font-size: 15px;
      opacity: 0.7;
      margin-bottom: 24px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 16px 28px;
      font-size: 17px;
      font-family: inherit;
      cursor: pointer;
      background: #b86b72;
      color: white;
      box-shadow: 0 6px 15px rgba(120, 50, 60, 0.2);
    }

    button:active {
      transform: scale(0.96);
    }

    .message {
      display: none;
      white-space: pre-line;
      margin-top: 30px;
      padding: 24px;
      border-radius: 20px;
      background: #f8eee9;
      font-size: 20px;
      line-height: 1.7;
      animation: appear 0.8s ease;
    }

    .message.show {
      display: block;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <main class="app">
    <div class="heart">💌</div>

    <h1>Per te</h1>

    <p class="subtitle">
      Ho preparato qualcosa per te.
    </p>

    <div class="day" id="dayText">
  Giorno 1 di 10
</div>

    <button id="openButton">
      APRI IL MESSAGGIO 💌
    </button>

    <div class="message" id="message"></div>
  </main>

  <script>
    const button = document.getElementById("openButton");
const message = document.getElementById("message");
const dayText = document.getElementById("dayText");

const messages = [
  `Congratulazioni!

Sei il fortunato vincitore di questa sorpresa.

10 messaggi per 10 giorni, una quantità discutibile di dolcezza e qualche uscita imbarazzante.

Unica regola: un messaggio al giorno.`,

  `Qui per ricordarti che mi manca tutto di te: le tue puzzette, i piatti lavati male, i tuoi film soporiferi...

Ma soprattutto mi manca il letto perfettamente tirato, come solo tu sai fare. 😌`,

  `Per te guarderei tutti i film della Marvel, ascolterei tutta la tua playlist con le canzoni senza parole e guarderei con te una corsa di F1 senza addormentarmi.

Se non è amore questo. 🥰`,

  `Le piante senza di te stanno morendo.

Torna presto. Ci manchi. ❤️‍🩹`,

  `Se fossi lì con te oggi, probabilmente ti abbraccerei fortissimo senza dire niente.

Poi probabilmente ti darei fastidio mentre fai qualcosa.

E poi ti abbraccerei di nuovo. 🫂`,

  `Che fortuna averti incontrato.

Che privilegio che, tra tante persone, tu abbia scelto me. ❤️`,

  `COUPON UFFICIALE 🎟️

Valido per: una raffica di bacini.

Utilizzabile al nostro prossimo incontro.

Con scadenza il giorno dell'arrivo.

Non cumulabile con altri coupon.`,

  `Tosta l'astinenza, eh? 😏🍬`,

  `Ti aspetto, amore mio. ❤️`,

  `Errore nella consegna del messaggio ❌

Il messaggio verrà consegnato di persona. 💬`
];

function getChinaDate() {
  const now = new Date();

  return new Date(
    now.toLocaleString("en-US", {
      timeZone: "Asia/Shanghai"
    })
  );
}

function getCurrentDay() {
  const startDate = new Date("2026-07-25T00:00:00");

  const chinaDate = getChinaDate();

  const difference =
    chinaDate.getTime() - startDate.getTime();

  const dayNumber =
    Math.floor(difference / (1000 * 60 * 60 * 24)) + 1;

  return Math.min(Math.max(dayNumber, 1), 10);
}

const currentDay = getCurrentDay();

dayText.textContent = `Giorno ${currentDay} di 10`;

button.addEventListener("click", function() {
  message.textContent = messages[currentDay - 1];

  message.classList.add("show");

  button.style.display = "none";

  const audioContext =
    new (window.AudioContext || window.webkitAudioContext)();

  const oscillator = audioContext.createOscillator();
  const gainNode = audioContext.createGain();

  oscillator.type = "sine";

  oscillator.frequency.setValueAtTime(
    880,
    audioContext.currentTime
  );

  oscillator.frequency.exponentialRampToValueAtTime(
    1320,
    audioContext.currentTime + 0.25
  );

  gainNode.gain.setValueAtTime(
    0.0001,
    audioContext.currentTime
  );

  gainNode.gain.exponentialRampToValueAtTime(
    0.12,
    audioContext.currentTime + 0.02
  );

  gainNode.gain.exponentialRampToValueAtTime(
    0.0001,
    audioContext.currentTime + 0.35
  );

  oscillator.connect(gainNode);
  gainNode.connect(audioContext.destination);

  oscillator.start();
  oscillator.stop(audioContext.currentTime + 0.35);
});

    button.addEventListener("click", function() {
      message.classList.add("show");
      button.style.display = "none";

     const audioContext = new (window.AudioContext || window.webkitAudioContext)();

const oscillator = audioContext.createOscillator();
const gainNode = audioContext.createGain();

oscillator.type = "sine";
oscillator.frequency.setValueAtTime(880, audioContext.currentTime);
oscillator.frequency.exponentialRampToValueAtTime(
  1320,
  audioContext.currentTime + 0.25
);

gainNode.gain.setValueAtTime(0.0001, audioContext.currentTime);
gainNode.gain.exponentialRampToValueAtTime(
  0.12,
  audioContext.currentTime + 0.02
);
gainNode.gain.exponentialRampToValueAtTime(
  0.0001,
  audioContext.currentTime + 0.35
);

oscillator.connect(gainNode);
gainNode.connect(audioContext.destination);

oscillator.start();
oscillator.stop(audioContext.currentTime + 0.35) ;
    });
  </script>

</body>
</html>
